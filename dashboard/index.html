<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="refresh" content="30">

<title>Linux Monitoring Dashboard</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:#e5e7eb;
}

.header{
background:#111827;
padding:25px;
text-align:center;
border-bottom:1px solid #334155;
}

.header h1{
margin:0;
font-size:36px;
}

.header p{
margin-top:10px;
font-size:18px;
color:#94a3b8;
}

.container{
max-width:1100px;
margin:40px auto;
padding:0 20px;
}

.status-box{
background:#111827;
border:1px solid #334155;
border-radius:16px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

pre{
font-size:24px;
line-height:1.8;
white-space:pre-wrap;
}

.footer{
text-align:center;
margin-top:35px;
font-size:16px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="header">

<h1>🖥️ Linux Monitoring Dashboard</h1>
<p>Enterprise Linux Monitoring & Automation Framework</p>


</div>

<div class="container">

<div class="status-box">

<pre id="status">

Loading system status...

</pre>

</div>

<div class="footer">

⚙️ Powered by Linux • Bash • Cron • Nginx

</div>

</div>

<script>
async function loadStatus() {
    const status = document.getElementById('status');
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);

    try {
        const response = await fetch(`status.txt?t=${Date.now()}`, {
            cache: 'no-store',
            signal: controller.signal
        });
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.text();
        if (!data.trim()) {
            throw new Error('Empty status response');
        }
        status.textContent = data;
    } catch (error) {
        const reason = error.name === 'AbortError'
            ? 'Request timed out'
            : error.message;
        status.textContent =
            `Monitoring data unavailable: ${reason}. ` +
            'Check Nginx and the monitoring workflow. Retrying on page refresh.';
    } finally {
        clearTimeout(timeout);
    }
}
loadStatus();
</script>

</body>

</html>
